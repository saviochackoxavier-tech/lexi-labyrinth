<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Lexi-Labyrinth cinematic promo — click to watch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.6" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.4"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#22d3ee" opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="50%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <rect width="1280" height="720" fill="url(#scan)"/>
  <rect x="0" y="0" width="8" height="720" fill="#f59e0b"/>

  <text x="72" y="86" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="4" fill="#67e8f9">OMNICORP LEGAL AFFAIRS // CINEMATIC PROMO</text>
  <line x1="72" y1="108" x2="620" y2="108" stroke="#1e293b" stroke-width="2"/>

  <text x="66" y="220" font-family="Consolas, 'Courier New', monospace" font-size="74" font-weight="700" letter-spacing="1" fill="url(#amber)">LEXI-</text>
  <text x="66" y="300" font-family="Consolas, 'Courier New', monospace" font-size="74" font-weight="700" letter-spacing="1" fill="url(#amber)">LABYRINTH</text>

  <text x="72" y="350" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="4" fill="#cbd5e1">THE MYTHOLOGICAL CONTRACT CLAUSE</text>
  <text x="72" y="380" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="4" fill="#cbd5e1">ESCAPE ROOM</text>

  <text x="72" y="438" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="1.5" fill="#64748b">Read the fine print. Flag the trap. Survive the bureaucracy.</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="2">
    <rect x="72" y="482" width="132" height="34" rx="4" fill="#22d3ee" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="88" y="504" fill="#67e8f9">1,000 DOCKETS</text>
    <rect x="218" y="482" width="186" height="34" rx="4" fill="#f59e0b" fill-opacity="0.07" stroke="#f59e0b" stroke-opacity="0.45"/>
    <text x="236" y="504" fill="#fcd34d">3 CHARGES / 5 MIN</text>
    <rect x="418" y="482" width="138" height="34" rx="4" fill="#f43f5e" fill-opacity="0.07" stroke="#f43f5e" stroke-opacity="0.45"/>
    <text x="436" y="504" fill="#fda4af">BOSS GATES</text>
  </g>

  <!-- contract card -->
  <g>
    <rect x="720" y="130" width="470" height="460" rx="10" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
    <path d="M720 180h470" stroke="#1e293b" stroke-width="2"/>
    <circle cx="748" cy="155" r="5" fill="#f43f5e" fill-opacity="0.8"/>
    <circle cx="766" cy="155" r="5" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="784" cy="155" r="5" fill="#10b981" fill-opacity="0.8"/>
    <text x="808" y="160" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#64748b">OMN-03_CONTRACT_REVIEW.TXT</text>

    <g font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#94a3b8">
      <text x="752" y="218">OMNICORP GLOBAL SERVICES, N.V.</text>
      <text x="752" y="242">TERMS OF SERVICE - GLOBAL ARBITRATION RIDER</text>
      <text x="752" y="266">FORM TOG-3.0 (REV. 2026-Q1)</text>

      <text x="752" y="312">1. DISPUTE RESOLUTION</text>
      <text x="752" y="336">1.1 Any dispute shall be resolved exclusively by</text>
      <text x="752" y="356">final, binding arbitration administered by the</text>
      <text x="752" y="376">OmniCorp Arbitration Tribunal in the Republic</text>
      <text x="752" y="396">of Nauru under its Confidential Procedures.</text>

      <text x="752" y="432">2. CLASS AND JURY WAIVER</text>
      <text x="752" y="456">2.1 You waive any right to participate in any</text>
      <text x="752" y="476">class, collective, consolidated, or representative</text>
      <text x="752" y="496">action, and you waive any right to a trial by jury.</text>
    </g>

    <rect x="748" y="508" width="300" height="54" rx="4" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="764" y="530" font-family="Consolas, 'Courier New', monospace" font-size="10" letter-spacing="2" fill="#f59e0b">PREDATORY CLAUSE DETECTED</text>
    <text x="764" y="549" font-family="Consolas, 'Courier New', monospace" font-size="10" letter-spacing="1" fill="#fcd34d">CLASS-ACTION WAIVER · 2 OF 5 FLAGGED</text>
  </g>

  <!-- play button -->
  <g filter="url(#shadow)">
    <circle cx="955" cy="360" r="78" fill="#020617" fill-opacity="0.72" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="955" cy="360" r="66" fill="#f59e0b" fill-opacity="0.18"/>
    <path d="M936 322l58 38-58 38z" fill="#fbbf24"/>
  </g>

  <text x="72" y="646" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="3" fill="#475569">OFFICIAL 16:9 CINEMATIC PROMO · CLICK TO WATCH ON GOOGLE DRIVE</text>
  <text x="72" y="676" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#334155">SERVER-SIDE OFFSET VERIFICATION · ANSWER KEYS NEVER REACH THE DOM</text>
</svg>
