<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-label="Lexi-Labyrinth: The Mythological Contract Clause Escape Room">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.35"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#22d3ee" opacity="0.06"/>
    </pattern>
    <radialGradient id="glowC" cx="86%" cy="16%" r="62%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowA" cx="10%" cy="95%" r="58%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>
  <rect width="1600" height="420" fill="url(#glowC)"/>
  <rect width="1600" height="420" fill="url(#glowA)"/>
  <rect width="1600" height="420" fill="url(#scan)"/>
  <rect x="0" y="0" width="8" height="420" fill="#f59e0b"/>

  <!-- corner brackets -->
  <path d="M28 28h54M28 28v54" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M1572 392h-54M1572 392v-54" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- eyebrow -->
  <text x="72" y="72" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="4" fill="#67e8f9">OMNICORP LEGAL AFFAIRS // DOCUMENT REVIEW TERMINAL 7.3.1</text>
  <line x1="72" y1="92" x2="760" y2="92" stroke="#1e293b" stroke-width="2"/>
  <circle cx="84" cy="112" r="4" fill="#f43f5e"/>
  <text x="98" y="117" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#64748b">PRIVILEGED &amp; CONFIDENTIAL · EYES ONLY</text>

  <!-- title -->
  <text x="64" y="196" font-family="Consolas, 'Courier New', monospace" font-size="86" font-weight="700" letter-spacing="2" fill="url(#amber)">LEXI-LABYRINTH</text>
  <text x="70" y="238" font-family="Consolas, 'Courier New', monospace" font-size="21" letter-spacing="5.5" fill="#cbd5e1">THE MYTHOLOGICAL CONTRACT CLAUSE ESCAPE ROOM</text>
  <text x="70" y="278" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="1.5" fill="#64748b">Read the fine print. Flag the trap. Survive the bureaucracy.</text>

  <!-- chips -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="2">
    <rect x="70" y="312" width="206" height="36" rx="4" fill="#22d3ee" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="88" y="335" fill="#67e8f9">[ 1,000 DOCKETS ]</text>

    <rect x="292" y="312" width="272" height="36" rx="4" fill="#f59e0b" fill-opacity="0.07" stroke="#f59e0b" stroke-opacity="0.45"/>
    <text x="310" y="335" fill="#fcd34d">[ ⌕ 3 CHARGES · 5:00 ]</text>

    <rect x="580" y="312" width="182" height="36" rx="4" fill="#f43f5e" fill-opacity="0.07" stroke="#f43f5e" stroke-opacity="0.45"/>
    <text x="598" y="335" fill="#fda4af">[ BOSS GATES ]</text>
  </g>

  <!-- terminal card -->
  <g>
    <rect x="1034" y="96" width="494" height="254" rx="10" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
    <path d="M1034 132h494" stroke="#1e293b" stroke-width="2"/>
    <circle cx="1058" cy="114" r="5" fill="#f43f5e" fill-opacity="0.8"/>
    <circle cx="1076" cy="114" r="5" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="1094" cy="114" r="5" fill="#10b981" fill-opacity="0.8"/>
    <text x="1118" y="119" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#64748b">OMNICORP//LEGAL · SECURE TERMINAL</text>

    <g font-family="Consolas, 'Courier New', monospace" font-size="14">
      <text x="1060" y="162" fill="#475569">[16:04:12]</text>
      <text x="1148" y="162" fill="#67e8f9">SYSTEM ::</text>
      <text x="1236" y="162" fill="#94a3b8">session attached</text>

      <text x="1060" y="192" fill="#475569">[16:04:19]</text>
      <text x="1148" y="192" fill="#67e8f9">AUDIT  ::</text>
      <text x="1236" y="192" fill="#6ee7b7">CLAUSE 04 CONFIRMED</text>

      <text x="1060" y="222" fill="#475569">[16:04:19]</text>
      <text x="1148" y="222" fill="#67e8f9">SCORE  ::</text>
      <text x="1236" y="222" fill="#fcd34d">+150 INTEGRITY</text>

      <text x="1060" y="252" fill="#475569">[16:04:26]</text>
      <text x="1148" y="252" fill="#67e8f9">BOSS   ::</text>
      <text x="1236" y="252" fill="#fda4af">HP 2/5 · CRITICAL</text>

      <text x="1060" y="282" fill="#475569">[16:04:31]</text>
      <text x="1148" y="282" fill="#67e8f9">SEARCH ::</text>
      <text x="1236" y="282" fill="#94a3b8">hint only, no coordinates</text>
    </g>

    <rect x="1060" y="306" width="9" height="16" fill="#22d3ee"/>
    <text x="1078" y="319" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#475569">intern@omn-legal:~$</text>
  </g>

  <text x="70" y="392" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2.4" fill="#475569">SERVER-SIDE OFFSET VERIFICATION · ANSWER KEYS NEVER REACH THE DOM</text>
</svg>
